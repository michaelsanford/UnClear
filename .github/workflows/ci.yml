name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  validate-manifest:
    name: Validate manifest.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate JSON
        run: python3 -c "import json, sys; json.load(open('manifest.json')); print('manifest.json is valid')"

      - name: Check manifest version
        run: |
          VERSION=$(python3 -c "import json; d=json.load(open('manifest.json')); print(d['manifest_version'])")
          if [ "$VERSION" != "3" ]; then
            echo "ERROR: Expected manifest_version 3, got $VERSION"
            exit 1
          fi
          echo "manifest_version: $VERSION (OK)"

  pack:
    name: Pack extension
    runs-on: ubuntu-latest
    needs: [test, validate-manifest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create extension zip
        run: |
          zip -r unclear-extension.zip \
            manifest.json \
            content.js \
            icon48.png \
            icon128.png

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unclear-extension
          path: unclear-extension.zip
          retention-days: 30
