name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  release:
    name: Pack, Sign & Create Draft Release
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      id-token: write     # Required for cosign OIDC token and build attestation
      attestations: write # Required for actions/attest-build-provenance
      contents: write     # Required to write release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "ERROR: tag $TAG does not match manifest.json version $VERSION (expected v$VERSION)"
            exit 1
          fi
          echo "Tag $TAG matches manifest.json version $VERSION"

      - name: Create extension zip
        env:
          TAG: ${{ github.ref_name }}
        run: |
          zip -r "unclear-extension-$TAG.zip" \
            manifest.json \
            content.js \
            icon48.png \
            icon128.png

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: unclear-extension-${{ github.ref_name }}.zip

      - name: Install cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      - name: Sign artifact with cosign (keyless, GitHub OIDC)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cosign sign-blob --yes \
            "unclear-extension-$TAG.zip" \
            --bundle "unclear-extension-$TAG.zip.bundle"

      - name: Create Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "unclear-extension-$TAG.zip" \
            "unclear-extension-$TAG.zip.bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --draft \
            --notes "[UnClear on the Chrome Web Store (unlisted)](https://chromewebstore.google.com/detail/unclear/bilmbccofgemneflaknfifappajdbcco)"
